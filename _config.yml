# FreyLab.systems — site-wide settings.
# NOTE: this file is NOT hot-reloaded. Change it, then restart `bundle exec jekyll serve`.

title: FreyLab.systems
email: frey.systems@gmail.com
description: >-
  Hands-on infrastructure, self-hosting, and homelab engineering — documented in
  public. Real systems, built on Necropolis, written down honestly: what I built,
  why, what broke, and what I learned.

# baseurl is the subpath the site is served from. Empty because the repo is
# named freylab-systems.github.io, which serves at the domain root.
baseurl: ""

# url is the canonical origin of this site and MUST match CNAME
# (freylab.systems) — not the github.io mirror it is also reachable at.
# jekyll-seo-tag builds rel="canonical" and og:url from this value, and
# jekyll-feed builds the feed's <link> from it. Pointing it at github.io
# told every crawler the mirror was the real site.
url: "https://freylab.systems"

github_username: freylab-systems
author: Jake Frey

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Post URLs, pinned to this shape so they never move when a post's categories
# change. Jekyll's default post permalink prefixes categories to the path,
# which would put this post under /homelab/ and leave post one under /.
permalink: /:year/:month/:day/:title:output_ext

# Newest post first on the front page.
paginate: 10

# Keep repo-only files out of the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - RUNBOOK.md
  - GIT-NOTES.md
  - vendor/
  - projects/
  - tools/

# Show post excerpts on the home page list.
show_excerpts: true

# Excerpt = everything above the <!--more--> marker in a post.
excerpt_separator: "<!--more-->"
